apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rag-monitoring-role
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enterprise-rag-ingress
  namespace: enterprise-rag
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: rag.enterprise.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: rag-backend-service
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rag-frontend-service
            port:
              number: 80

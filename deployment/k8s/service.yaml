apiVersion: v1
kind: Service
metadata:
  name: rag-backend-service
  namespace: enterprise-rag
spec:
  selector:
    app: rag-backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: rag-frontend-service
  namespace: enterprise-rag
spec:
  selector:
    app: rag-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: LoadBalancer
